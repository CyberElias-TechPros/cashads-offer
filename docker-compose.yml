# Production-like stack: real Postgres + API (with worker) + web.
#   APP_SECRET=$(openssl rand -hex 32) docker compose up --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cashads
      POSTGRES_PASSWORD: cashads
      POSTGRES_DB: cashads
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cashads']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., target: api }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgres://cashads:cashads@postgres:5432/cashads
      APP_SECRET: ${APP_SECRET:?set APP_SECRET to 32+ random chars}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_ON_START: ${SEED_ON_START:-true}
      DATA_DIR: /tmp/cashads
    restart: unless-stopped

  web:
    build: { context: ., target: web }
    depends_on: [api]
    environment:
      API_INTERNAL_URL: http://api:4000
      FRAME_ANCESTORS: "'self'"
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  pgdata:
